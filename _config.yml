theme: jekyll-theme-chirpy

lang: en

timezone: America/New_York

title: Mark Lilback
tagline: Autistic macOS/Rust/web programmer, gamer
description: >-
  Personal blog of Mark Lilback — Autistic macOS/Rust/full-stack developer, gamer, and software architect
  living in Pittsburgh, PA.

url: "https://www.lilback.com"
baseurl: ""

github:
  username: mlilback

social:
  name: Mark Lilback
  links:
    - https://github.com/mlilback
    - https://www.facebook.com/mlilback
    - https://mastodon.social/@mlilback
    - https://bsky.app/profile/mlilback.bsky.social

# Theme mode: light | dark | (empty = follow system preference with toggle)
theme_mode: light

avatar: https://www.gravatar.com/avatar/d0f622051018990eed97e43f67c27962?s=200

toc: true

comments:
  provider:

paginate: 10

# Preserve old URL structure (was /:title/ before migration)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

collections:
  tabs:
    output: true
    sort_by: order

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - eino/process.pl
